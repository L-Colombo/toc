[project]
name = "toc"
version = "0.1.0"
description = "Toc - a CLI utility to to edit the table of contents of your PDFs"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "chardet>=7.5.1",
  "click>=8.4.2",
  "pymupdf>=1.28.2",
  "toml>=0.10.2",
]

[project.scripts]
toc = "main:main"
